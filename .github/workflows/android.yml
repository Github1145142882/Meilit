name: Android

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meilit-halo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish first release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.0
          name: Meilit Halo v1.0.0
          body: |
            First release of the AW20072 灵动光环 controller.

            - MD3 Expressive-inspired native Android UI
            - 16 LED ring preview and per-light controls
            - light/all_light/alone_light/effect support
            - reg, imax, hwen, i2c_log, rgbcolor, allrgbcolor, rgbbrightness, allrgbbrightness advanced nodes
            - Built-in chase, rainbow rotate, and breath play modes
          artifacts: app/build/outputs/apk/debug/*.apk
          artifactContentType: application/vnd.android.package-archive
          allowUpdates: true
          replacesArtifacts: true
